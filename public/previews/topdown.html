<!doctype html>
<!-- Style preview (still mock-up) for the 2D top-down pixel option. Open /previews/topdown.html. -->
<html><head><meta charset="utf-8"><title>Top-down preview</title>
<style>
@font-face{font-family:"Pixelify Sans";src:url(/fonts/pixelify-sans-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Pixelify Sans";src:url(/fonts/pixelify-sans-latin-600-normal.woff2) format("woff2");font-weight:600}
html,body{margin:0;height:100%;background:#1b1a2e;overflow:hidden;font-family:"Pixelify Sans",monospace;color:#3B3355}
canvas{position:fixed;left:0;top:0;width:1200px;height:720px;image-rendering:pixelated}
.box{position:fixed;background:#fff8ec;border:3px solid #3B3355;box-shadow:4px 4px 0 rgba(40,34,70,.4);padding:8px 12px}
.hud{left:14px;top:12px;width:190px;display:grid;gap:5px;font-size:15px}
.hud b{font-size:20px}
.row{display:grid;grid-template-columns:56px 1fr;align-items:center;gap:8px}
.bar{height:10px;background:#e3dcea}.bar i{display:block;height:100%}
.inv{left:14px;bottom:14px;font-size:16px}
.on{right:14px;top:12px;font-size:15px}
.tag{position:fixed;font-size:14px;font-weight:600;color:#fff;text-shadow:2px 0 #3B3355,-2px 0 #3B3355,0 2px #3B3355,0 -2px #3B3355;transform:translate(-50%,-100%)}
.prompt{left:50%;bottom:150px;transform:translateX(-50%);font-size:17px}
.prompt kbd{border:2px solid #3B3355;padding:0 5px;margin-right:6px;font-family:inherit}
</style></head><body>
<canvas id="c" width="400" height="240"></canvas>
<div class="box hud"><b>Day 3 <small style="font-size:14px;color:#7A7196">morning</small></b>
 <div class="row">Health<div class="bar"><i style="width:90%;background:#FF6F86"></i></div></div>
 <div class="row">Food<div class="bar"><i style="width:64%;background:#FFB547"></i></div></div>
 <div class="row">Water<div class="bar"><i style="width:52%;background:#4DB8F0"></i></div></div>
 <div class="row">Energy<div class="bar"><i style="width:80%;background:#6CCB6A"></i></div></div></div>
<div class="box on"><b>On the island (2)</b><br>&#9632; Thaqif (you)<br>&#9632; Aiman</div>
<div class="box inv">Wood <b>6</b> &nbsp; Stone <b>4</b> &nbsp; Clay <b>2</b><br><span style="font-size:13px;color:#7A7196">You can make 2 things. Press B for recipes.</span></div>
<div class="box prompt"><kbd>E</kbd>Chop the tree</div>
<div id="tags"></div>
<script src="/shared/world-gen.js"></script>
<script>
const WG = window.WorldGen, { heightAt, SPRING, mulberry32 } = WG;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 400, H = 240, T = 16;               // 16 pixels per world unit
const cam = { x: 0.5, z: 26 };              // world point at screen centre
const toScreen = (x, z) => [Math.round((x - cam.x) * T + W / 2), Math.round((z - cam.z) * T + H / 2)];
const hash = (x, y) => { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); };
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];

// ---------- terrain, per pixel ----------
const img = g.createImageData(W, H), d = img.data;
const P = {
  deep: ['#2f7fb3', '#3b8fc4'], shallow: ['#56b5d8', '#62c3e2'], foam: ['#e9fbff'],
  wet: ['#d9bf8a', '#e3c995'], sand: ['#f2dca4', '#ead297', '#f7e6b8'],
  grass: ['#6cbf55', '#79c95e', '#5fb04c', '#86d46a'], grassEdge: ['#4f9a44'], rock: ['#a9a397', '#b8b2a6'],
  pond: ['#7fd6ea', '#8fe0f0'], moss: ['#5da85a', '#68b563'],
};
for (let py = 0; py < H; py++) for (let px = 0; px < W; px++) {
  const x = cam.x + (px - W / 2 + .5) / T, z = cam.z + (py - H / 2 + .5) / T;
  const h = heightAt(x, z), n = hash(Math.floor(px / 2), Math.floor(py / 2)), n1 = hash(px, py);
  let c;
  const sd = Math.hypot(x - SPRING.x, z - SPRING.z);
  if (sd < 2.25) c = P.pond[n < .8 ? 0 : 1];
  else if (h < -.9) c = P.deep[(Math.sin(px * .3 + py * .9) > .85) ? 1 : 0];
  else if (h < -.05) c = P.shallow[(Math.sin(px * .25 + py * 1.1) > .9) ? 1 : 0];
  else if (h < .05) c = P.foam[0];
  else if (h < .3) c = P.wet[n1 < .85 ? 0 : 1];
  else if (h < .95) c = P.sand[n1 < .8 ? 0 : n1 < .93 ? 1 : 2];
  else if (h < .99) c = P.grassEdge[0];
  else if (h > 5.8) c = P.rock[n < .7 ? 0 : 1];
  else c = sd < 5 ? P.moss[n < .8 ? 0 : 1] : P.grass[n < .55 ? 0 : n < .8 ? 1 : n < .93 ? 2 : 3];
  const [r, gg, b] = hex(c), i = (py * W + px) * 4;
  d[i] = r; d[i + 1] = gg; d[i + 2] = b; d[i + 3] = 255;
}
g.putImageData(img, 0, 0);

// ---------- sprite maker: paint, then outline ----------
function sprite(w, h, paint, outline = '#2b2438') {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'), im = x.createImageData(w, h), a = im.data;
  const set = (px, py, col) => { if (px < 0 || py < 0 || px >= w || py >= h) return; const [r, gg, b] = hex(col), i = (py * w + px) * 4; a[i] = r; a[i + 1] = gg; a[i + 2] = b; a[i + 3] = 255; };
  paint(set);
  if (outline) {
    const on = (px, py) => px >= 0 && py >= 0 && px < w && py < h && a[(py * w + px) * 4 + 3] === 255;
    const add = [];
    for (let py = 0; py < h; py++) for (let px = 0; px < w; px++)
      if (!on(px, py) && (on(px + 1, py) || on(px - 1, py) || on(px, py + 1) || on(px, py - 1))) add.push([px, py]);
    add.forEach(([px, py]) => { const i = (py * w + px) * 4; const [r, gg, b] = hex(outline); a[i] = r; a[i + 1] = gg; a[i + 2] = b; a[i + 3] = 254; });
  }
  x.putImageData(im, 0, 0);
  return c;
}
// shaded blob: light from top-left, 4 tones, leafy clumps
function blob(set, circles, pal, seed) {
  for (let y = 0; y < 80; y++) for (let x = 0; x < 64; x++) {
    let best = null;
    for (const [cx, cy, r] of circles) { const dx = (x - cx) / r, dy = (y - cy) / r, q = dx * dx + dy * dy; if (q <= 1 && (!best || q < best.q)) best = { q, dx, dy }; }
    if (!best) continue;
    let l = .55 - best.dx * .45 - best.dy * .55 + (hash(Math.floor(x / 3) + seed, Math.floor(y / 3)) - .5) * .5;
    set(x, y, pal[Math.max(0, Math.min(3, Math.floor(l * 2.2 + 1)))]);
  }
}
const TREE = { oak: ['#2f6b3a', '#3f8f45', '#5bb04f', '#8fd46a'], blossom: ['#b85a7c', '#e07fa0', '#f6a8c2', '#ffd3e2'] };
function oakSprite(kind, seed) {
  return sprite(48, 64, set => {
    for (let y = 34; y < 62; y++) for (let x = 20; x < 28; x++) set(x, y, x < 23 ? '#7a4f35' : x < 26 ? '#9a6644' : '#b07a52');
    blob(set, [[24, 20, 15], [12, 30, 10], [36, 30, 10], [24, 34, 11]], TREE[kind], seed);
  });
}
function pineSprite() {
  return sprite(32, 64, set => {
    for (let y = 48; y < 62; y++) for (let x = 14; x < 18; x++) set(x, y, x < 16 ? '#7a4f35' : '#9a6644');
    [[4, 22, 14], [14, 34, 12], [26, 50, 10]].forEach(([top, bot, hw]) => {
      for (let y = top; y < bot; y++) { const k = (y - top) / (bot - top), half = Math.round(2 + k * hw);
        for (let x = 16 - half; x < 16 + half; x++) set(x, y, x < 16 - half / 3 ? '#2e7a4f' : x < 16 + half / 3 ? '#3f9a5f' : '#57b574'); }
    });
  });
}
function palmSprite(seed) {
  const r = mulberry32(seed);
  return sprite(56, 64, set => {
    const bend = 4 + r() * 6;
    for (let y = 22; y < 62; y++) { const k = (62 - y) / 40, cx = 28 + Math.round(bend * k * k);
      for (let x = cx - 2; x <= cx + 2; x++) set(x, y, (y % 5 === 0) ? '#8a5f3c' : x < cx ? '#a0744b' : '#c09060'); }
    const tx = 28 + Math.round(bend), ty = 20;
    for (let f = 0; f < 7; f++) {
      const a = f / 7 * Math.PI * 2 + r() * .4;
      for (let s = 0; s < 20; s++) {
        const px = tx + Math.cos(a) * s, py = ty + Math.sin(a) * s * .55 + (s * s) * .035;
        const wdt = s < 4 ? 1 : s < 14 ? 2 : 1;
        for (let o = -wdt; o <= wdt; o++) set(Math.round(px), Math.round(py + o), o < 0 ? '#8fd46a' : o === 0 ? '#5bb04f' : '#3f8f45');
      }
    }
    [[-2, 2], [2, 3], [0, 4]].forEach(([dx, dy]) => { for (let y = -1; y <= 1; y++) for (let x = -1; x <= 1; x++) set(tx + dx + x, ty + dy + y, (x + y < 0) ? '#8a5f3c' : '#6a4630'); });
  });
}
function bushSprite(berry, seed) {
  const r = mulberry32(seed);
  return sprite(24, 20, set => {
    blob(set, [[12, 11, 8], [6, 13, 5], [18, 13, 5]], ['#2f6b3a', '#3f8f45', '#5bb04f', '#79c95e'], seed);
    for (let i = 0; i < 6; i++) { const x = 4 + Math.floor(r() * 16), y = 6 + Math.floor(r() * 10); set(x, y, berry); set(x + 1, y, berry); set(x, y + 1, berry); set(x + 1, y + 1, '#ffffff'); }
  });
}
function rockSprite(pal, specks) {
  return sprite(22, 16, set => {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 22; x++) {
      const dx = (x - 11) / 10, dy = (y - 9) / 6.5; if (dx * dx + dy * dy > 1) continue;
      const l = .5 - dx * .4 - dy * .6; set(x, y, pal[Math.max(0, Math.min(2, Math.floor(l * 2 + 1)))]);
    }
    if (specks) [[6, 7], [13, 5], [16, 10], [9, 11]].forEach(([x, y]) => { set(x, y, specks); set(x + 1, y, specks); set(x, y - 1, '#fff2dc'); });
  });
}
function digSprite() {
  return sprite(18, 10, set => {
    for (let y = 0; y < 10; y++) for (let x = 0; x < 18; x++) { const dx = (x - 9) / 8, dy = (y - 5) / 4; if (dx * dx + dy * dy <= 1) set(x, y, dy < -.2 ? '#b5845a' : '#946441'); }
    set(8, 1, '#79c95e'); set(8, 0, '#79c95e'); set(9, 0, '#8fd46a');
  });
}
// the castaway, hand-drawn
const K = { k: '#2b2438', h: '#f2d48a', H: '#d9b56a', s: '#ffd2b0', S: '#e8b590', e: '#2b2438', c: '#ff9aa8', b: '#5b6fb5', f: '#8a5a44' };
function person(shirt, dark) {
  const rows = [
    '.....hhhhhh.....',
    '...hhHHHHHHhh...',
    '..hhhhhhhhhhhh..',
    '....ssssssss....',
    '...ssssssssss...',
    '...ssesssssess..',
    '...scssssssscs..',
    '....ssssssss....',
    '.....SSSSSS.....',
    '...xxxxxxxxxx...',
    '..sxxxxxxxxxxs..',
    '..sxxxXXXXxxxs..',
    '...xxxxxxxxxx...',
    '....bbbbbbbb....',
    '....bbb..bbb....',
    '....ss....ss....',
    '....ff....ff....',
  ];
  return sprite(16, rows.length, set => rows.forEach((r, y) => [...r].forEach((ch, x) => {
    if (ch === '.') return; set(x, y, ch === 'x' ? shirt : ch === 'X' ? dark : K[ch]);
  })));
}
function fireSprite() {
  return sprite(20, 18, set => {
    [[3, 13], [7, 15], [12, 15], [16, 13], [5, 10], [15, 10]].forEach(([x, y]) => { set(x, y, '#a9a397'); set(x + 1, y, '#8f8a80'); set(x, y + 1, '#8f8a80'); set(x + 1, y + 1, '#77726a'); });
    for (let y = 2; y < 14; y++) { const hw = Math.round((y - 2) / 12 * 5); for (let x = 10 - hw; x <= 10 + hw; x++) set(x, y, y > 9 && Math.abs(x - 10) < 2 ? '#fff3a0' : Math.abs(x - 10) < hw - 1 ? '#ffc247' : '#ff7a3a'); }
    for (let x = 6; x < 15; x++) set(x, 14, '#7a4f35');
  });
}

// ---------- place things ----------
const objs = WG.generateObjects(7), draw = [];
const shadow = (x, y, w) => { g.fillStyle = 'rgba(40,34,70,.25)'; g.beginPath(); g.ellipse(x, y, w, w * .35, 0, 0, 7); g.fill(); };
for (const o of objs) {
  const [sx, sy] = toScreen(o.x, o.z);
  if (sx < -40 || sx > W + 40 || sy < -10 || sy > H + 70) continue;
  const sc = o.maxScale || 1;
  let spr, sw = 12;
  if (o.type === 'tree') { spr = o.species === 'pine' ? pineSprite() : oakSprite(o.species, o.id); sw = 11 * sc; }
  else if (o.type === 'palm') { spr = palmSprite(o.id); sw = 8; }
  else if (o.type === 'bush') { spr = bushSprite(o.species === 'blueberry' ? '#5b7be8' : '#ff4f6d', o.id); sw = 9; }
  else if (o.type === 'rock') spr = rockSprite(o.species === 'pebble' ? ['#c9b98f', '#e6d6b8', '#f5ecd6'] : ['#8a857b', '#b1ab9f', '#d2cdc3']);
  else if (o.type === 'ore') spr = rockSprite(['#7c7488', '#9c97a6', '#bdb8c6'], o.ore === 'iron' ? '#e4e9f2' : '#f08c4a');
  else if (o.type === 'dig') { spr = digSprite(); sw = 0; }
  draw.push({ y: sy, fn: () => { if (sw) shadow(sx, sy, sw); g.drawImage(spr, sx - (spr.width >> 1), sy - spr.height + 3); } });
}
// flowers: daisies, tulips, sea pinks
const fr = mulberry32(99);
for (let i = 0; i < 260; i++) {
  const px = Math.floor(fr() * W), py = Math.floor(fr() * H);
  const x = cam.x + (px - W / 2) / T, z = cam.z + (py - H / 2) / T, h = heightAt(x, z);
  if (h > 1.1 && h < 5.5) {
    const kind = fr();
    if (kind < .5) { g.fillStyle = '#ffffff'; g.fillRect(px - 1, py, 3, 1); g.fillRect(px, py - 1, 1, 3); g.fillStyle = '#ffd43b'; g.fillRect(px, py, 1, 1); }
    else if (kind < .8) { g.fillStyle = '#4f9a44'; g.fillRect(px, py, 1, 2); g.fillStyle = ['#ff5c7a', '#ffb547', '#c77dff'][i % 3]; g.fillRect(px, py - 2, 2, 2); }
    else { g.fillStyle = '#4f9a44'; g.fillRect(px, py, 1, 1); g.fillRect(px + 2, py - 1, 1, 1); g.fillRect(px - 1, py - 1, 1, 1); }
  } else if (h > .5 && h < .9 && fr() < .3) { g.fillStyle = '#ff9ebb'; g.fillRect(px, py, 2, 2); g.fillStyle = '#ffd1de'; g.fillRect(px, py, 1, 1); }
}
// two castaways and a campfire
const people = [[1.2, 27.3, '#FF7A8A', '#d9566a', 'Thaqif'], [3.6, 26.6, '#6EC6FF', '#4a9fd6', 'Aiman']];
people.forEach(([x, z, c1, c2, name]) => {
  const [sx, sy] = toScreen(x, z), spr = person(c1, c2);
  draw.push({ y: sy, fn: () => { shadow(sx, sy, 6); g.drawImage(spr, sx - 8, sy - spr.height + 1); } });
  const t = document.createElement('div'); t.className = 'tag'; t.textContent = name; t.style.left = sx * 3 + 'px'; t.style.top = (sy - 19) * 3 + 'px';
  document.getElementById('tags').appendChild(t);
});
{ const [sx, sy] = toScreen(2.6, 28.6), spr = fireSprite(); draw.push({ y: sy, fn: () => g.drawImage(spr, sx - 10, sy - 16) }); }
draw.sort((a, b) => a.y - b.y).forEach(o => o.fn());
</script></body></html>
